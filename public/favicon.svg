<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#gymGrad)"/>

  <!-- Solid White Dumbbell Matching Gym Logo -->
  <g fill="#ffffff">
    <!-- Center Bar -->
    <rect x="126" y="238" width="260" height="36" rx="12" ry="12"/>
    <!-- Left Collar -->
    <rect x="195" y="206" width="20" height="100" rx="8" ry="8"/>
    <!-- Left Main Weight Plate -->
    <rect x="135" y="136" width="50" height="240" rx="16" ry="16"/>
    <!-- Left Outer Weight Plate -->
    <rect x="90" y="181" width="35" height="150" rx="14" ry="14"/>

    <!-- Right Collar -->
    <rect x="297" y="206" width="20" height="100" rx="8" ry="8"/>
    <!-- Right Main Weight Plate -->
    <rect x="327" y="136" width="50" height="240" rx="16" ry="16"/>
    <!-- Right Outer Weight Plate -->
    <rect x="387" y="181" width="35" height="150" rx="14" ry="14"/>
  </g>
</svg>
